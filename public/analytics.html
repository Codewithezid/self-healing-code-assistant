<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Code Assistant Analytics</title>
  <link rel="stylesheet" href="/styles.css" />
  <style>
    .ana-wrap { max-width: 1100px; margin: 0 auto; padding: 24px; }
    .ana-grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
    .ana-card { border: 1px solid var(--line); border-radius: 12px; padding: 14px; background: var(--bg1); }
    .ana-kpi { font-size: 24px; font-weight: 700; }
    .ana-table { width: 100%; border-collapse: collapse; font-size: 14px; margin-top: 10px; }
    .ana-table th, .ana-table td { border-bottom: 1px solid var(--line); padding: 10px; text-align: left; }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="wordmark">
      <span class="wordmark-title">Feedback Analytics</span>
      <span class="wordmark-sep">-</span>
      <a class="wordmark-sub" href="/">Back to Assistant</a>
    </div>
  </div>
  <main class="ana-wrap">
    <h1>Feedback Loop + Analytics</h1>
    <p>Tracks user correctness feedback, profile usage, and hallucination risk trends.</p>
    <div class="ana-grid" id="summaryCards"></div>
    <h2>Recent Feedback</h2>
    <table class="ana-table">
      <thead>
        <tr>
          <th>Time</th>
          <th>Verdict</th>
          <th>Rating</th>
          <th>Profile</th>
          <th>RAG</th>
          <th>Comment</th>
        </tr>
      </thead>
      <tbody id="feedbackRows"></tbody>
    </table>
  </main>
  <script src="/analytics.js?v=20260513a"></script>
</body>
</html>
